<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07110f">
<title>Enigma Cipher</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: #07110f;
    color: #f2e9d5;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 15%, rgba(105, 78, 35, .22), transparent 28%),
        radial-gradient(circle at 90% 85%, rgba(40, 90, 70, .18), transparent 30%),
        linear-gradient(145deg, #050b09, #10231e 50%, #07110f);
    background-attachment: fixed;
    padding: 14px;
}

.app {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.header {
    text-align: center;
    padding: 12px 4px 18px;
}

.header h1 {
    margin: 0;
    color: #f0d99d;
    font-family: Georgia, serif;
    font-size: clamp(28px, 8vw, 48px);
    letter-spacing: 2px;
}

.header p {
    margin: 7px 0 0;
    color: #d8b46a;
    font-size: 11px;
    letter-spacing: 3px;
}

.card {
    background: rgba(11, 25, 22, .96);
    border: 1px solid #806536;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 12px 35px rgba(0,0,0,.28);
}

.section-title {
    color: #d8b46a;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 9px;
}

/* Mode */
.mode {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.mode button {
    min-height: 48px;
    border: 1px solid #66532f;
    border-radius: 10px;
    background: #10231e;
    color: #f2e9d5;
    font-size: 15px;
    font-weight: bold;
}

.mode button.active {
    background: #d8b46a;
    color: #17130b;
}

/* Three rotor controls */
.controls-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.control label {
    display: block;
    color: #a8a493;
    font-size: 11px;
    margin-bottom: 5px;
}

select, input, textarea {
    width: 100%;
    border: 1px solid #66532f;
    border-radius: 10px;
    background: #07110f;
    color: #f2e9d5;
    outline: none;
    font-size: 16px;
}

select {
    height: 48px;
    padding: 0 9px;
}

input {
    height: 50px;
    padding: 0 13px;
}

select:focus, input:focus, textarea:focus {
    border-color: #d8b46a;
}

/* Message/result */
textarea {
    min-height: 150px;
    resize: vertical;
    padding: 13px;
    line-height: 1.45;
}

.result {
    color: #f0d99d;
}

/* Main action */
.action {
    width: 100%;
    min-height: 58px;
    border: 0;
    border-radius: 12px;
    background: #d8b46a;
    color: #17130b;
    font-size: 17px;
    font-weight: bold;
    box-shadow: 0 6px 18px rgba(216,180,106,.15);
}

.action:active {
    transform: scale(.98);
    background: #f0d99d;
}

.secondary-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 9px;
}

.secondary {
    min-height: 48px;
    border: 1px solid #66532f;
    border-radius: 10px;
    background: #10231e;
    color: #f2e9d5;
    font-size: 14px;
    font-weight: bold;
}

.hint {
    text-align: center;
    color: #777d73;
    font-size: 11px;
    margin-top: 12px;
}

/* Decorative background details */
.machine {
    display: flex;
    justify-content: center;
    gap: 10px;
    opacity: .22;
    margin: 2px 0 13px;
}

.rotor {
    width: 45px;
    height: 45px;
    border: 2px solid #d8b46a;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: monospace;
    color: #f0d99d;
}

/* Small phones */
@media (max-width: 430px) {
    body {
        padding: 9px;
    }

    .card {
        padding: 12px;
        border-radius: 13px;
    }

    .controls-grid {
        gap: 7px;
    }

    select {
        padding: 0 5px;
    }

    textarea {
        min-height: 135px;
    }

    .header {
        padding-bottom: 13px;
    }

    .header h1 {
        font-size: 30px;
    }

    .header p {
        font-size: 9px;
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>
<div class="app">

    <div class="header">
        <div class="machine">
            <div class="rotor">I</div>
            <div class="rotor">II</div>
            <div class="rotor">III</div>
        </div>
        <h1>ENIGMA CIPHER</h1>
        <p>ENCRYPT • DECRYPT • SECURE</p>
    </div>

    <!-- MODE -->
    <div class="card">
        <div class="section-title">MODE</div>
        <div class="mode">
            <button id="encryptMode" class="active" onclick="setMode('encrypt')">
                🔐 Encrypt
            </button>
            <button id="decryptMode" onclick="setMode('decrypt')">
                🔓 Decrypt
            </button>
        </div>
    </div>

    <!-- ROTORS -->
    <div class="card">
        <div class="section-title">ROTORS — LEFT / MIDDLE / RIGHT</div>

        <div class="controls-grid">
            <div class="control">
                <label>LEFT ROTOR</label>
                <select id="rotor1"></select>
            </div>

            <div class="control">
                <label>MIDDLE ROTOR</label>
                <select id="rotor2"></select>
            </div>

            <div class="control">
                <label>RIGHT ROTOR</label>
                <select id="rotor3"></select>
            </div>
        </div>
    </div>

    <!-- START POSITIONS -->
    <div class="card">
        <div class="section-title">STARTING POSITIONS — L / M / R</div>

        <div class="controls-grid">
            <div class="control">
                <label>LEFT POSITION</label>
                <select id="pos1"></select>
            </div>

            <div class="control">
                <label>MIDDLE POSITION</label>
                <select id="pos2"></select>
            </div>

            <div class="control">
                <label>RIGHT POSITION</label>
                <select id="pos3"></select>
            </div>
        </div>
    </div>

    <!-- PLUGBOARD -->
    <div class="card">
        <div class="section-title">PLUGBOARD</div>
        <input
            id="plugboard"
            type="text"
            value="AB CD EF GH"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="AB CD EF GH"
        >
        <div class="hint">
            Enter pairs such as AB CD EF GH
        </div>
    </div>

    <!-- MESSAGE -->
    <div class="card">
        <div class="section-title">MESSAGE</div>
        <textarea
            id="message"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="Enter your message here..."
        ></textarea>
    </div>

    <!-- ACTION -->
    <div class="card">
        <button id="action" class="action" onclick="runCipher()">
            🔐 ENCRYPT / GET RESULT
        </button>

        <div class="secondary-row">
            <button class="secondary" onclick="copyResult()">
                📋 COPY RESULT
            </button>

            <button class="secondary" onclick="clearAll()">
                🗑 CLEAR
            </button>
        </div>
    </div>

    <!-- RESULT -->
    <div class="card">
        <div class="section-title">RESULT</div>
        <textarea
            id="result"
            class="result"
            readonly
            placeholder="Your encrypted/decrypted text will appear here..."
        ></textarea>
    </div>

    <div class="hint">
        Use the exact same rotors, positions and plugboard to decrypt.
    </div>

</div>

<script>
const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const ROTORS = {
    "I":   "EKMFLGDQVZNTOWYHXUSPAIBRCJ",
    "II":  "AJDKSIRUXBLHWTMCQGZNPYFVOE",
    "III": "BDFHJLCPRTXVZNYEIWGAKMUSQO",
    "IV":  "ESOVPZJAYQUIRHXLNFTGKDCMWB",
    "V":   "VZBRGITYUPSDNHLXAWMJQOFECK"
};

const REFLECTOR = "YRUHQSLDPXNGOKMIEBFZCWVJAT";

const NOTCHES = {
    "I": "Q",
    "II": "E",
    "III": "V",
    "IV": "J",
    "V": "Z"
};

let mode = "encrypt";


function fillSelectors() {
    const rotorOptions = ["I", "II", "III", "IV", "V"];

    for (const id of ["rotor1", "rotor2", "rotor3"]) {
        const select = document.getElementById(id);

        for (const rotor of rotorOptions) {
            const option = document.createElement("option");
            option.value = rotor;
            option.textContent = rotor;
            select.appendChild(option);
        }
    }

    document.getElementById("rotor1").value = "I";
    document.getElementById("rotor2").value = "II";
    document.getElementById("rotor3").value = "III";

    for (const id of ["pos1", "pos2", "pos3"]) {
        const select = document.getElementById(id);

        for (const letter of ALPHABET) {
            const option = document.createElement("option");
            option.value = letter;
            option.textContent = letter;
            select.appendChild(option);
        }
    }

    document.getElementById("pos1").value = "A";
    document.getElementById("pos2").value = "B";
    document.getElementById("pos3").value = "C";
}


function setMode(newMode) {
    mode = newMode;

    document.getElementById("encryptMode")
        .classList.toggle("active", mode === "encrypt");

    document.getElementById("decryptMode")
        .classList.toggle("active", mode === "decrypt");

    document.getElementById("action").textContent =
        mode === "encrypt"
        ? "🔐 ENCRYPT / GET RESULT"
        : "🔓 DECRYPT / GET RESULT";
}


function makePlugboard(pairs) {
    const board = {};

    for (const c of ALPHABET) {
        board[c] = c;
    }

    for (const [a, b] of pairs) {
        board[a] = b;
        board[b] = a;
    }

    return board;
}


function getPlugboard() {
    const raw = document
        .getElementById("plugboard")
        .value
        .toUpperCase()
        .trim();

    if (!raw) {
        return [];
    }

    const parts = raw.split(/\s+/);
    const pairs = [];
    const used = new Set();

    for (const pair of parts) {
        if (pair.length !== 2) {
            throw new Error(
                `Invalid plugboard pair: ${pair}. Use AB CD EF GH.`
            );
        }

        const a = pair[0];
        const b = pair[1];

        if (!ALPHABET.includes(a) || !ALPHABET.includes(b)) {
            throw new Error("Plugboard pairs can only contain A-Z.");
        }

        if (a === b) {
            throw new Error(`${pair}: a letter cannot connect to itself.`);
        }

        if (used.has(a) || used.has(b)) {
            throw new Error(`Letter used more than once: ${pair}`);
        }

        used.add(a);
        used.add(b);
        pairs.push([a, b]);
    }

    return pairs;
}


function rotorForward(letter, wiring, position) {
    const index =
        (ALPHABET.indexOf(letter) + position) % 26;

    const mapped = wiring[index];

    return ALPHABET[
        (ALPHABET.indexOf(mapped) - position + 26) % 26
    ];
}


function rotorBackward(letter, wiring, position) {
    const index =
        (ALPHABET.indexOf(letter) + position) % 26;

    const mapped =
        ALPHABET[wiring.indexOf(ALPHABET[index])];

    return ALPHABET[
        (ALPHABET.indexOf(mapped) - position + 26) % 26
    ];
}


class Enigma {

    constructor(rotorNames, positions, plugPairs) {
        this.rotorNames = rotorNames;

        this.wirings = [
            ROTORS[rotorNames[0]],
            ROTORS[rotorNames[1]],
            ROTORS[rotorNames[2]]
        ];

        this.positions = [...positions];

        this.plugboard = makePlugboard(plugPairs);
    }


    stepRotors() {
        const left = this.positions[0];
        const middle = this.positions[1];
        const right = this.positions[2];

        const middleAtNotch =
            ALPHABET[middle] === NOTCHES[this.rotorNames[1]];

        const rightAtNotch =
            ALPHABET[right] === NOTCHES[this.rotorNames[2]];

        if (middleAtNotch) {
            this.positions[0] =
                (left + 1) % 26;

            this.positions[1] =
                (middle + 1) % 26;

        } else if (rightAtNotch) {
            this.positions[1] =
                (middle + 1) % 26;
        }

        this.positions[2] =
            (right + 1) % 26;
    }


    encryptLetter(letter) {
        this.stepRotors();

        letter = this.plugboard[letter];

        // Right -> Middle -> Left
        letter = rotorForward(
            letter,
            this.wirings[2],
            this.positions[2]
        );

        letter = rotorForward(
            letter,
            this.wirings[1],
            this.positions[1]
        );

        letter = rotorForward(
            letter,
            this.wirings[0],
            this.positions[0]
        );

        // Reflector
        letter =
            REFLECTOR[ALPHABET.indexOf(letter)];

        // Left -> Middle -> Right
        letter = rotorBackward(
            letter,
            this.wirings[0],
            this.positions[0]
        );

        letter = rotorBackward(
            letter,
            this.wirings[1],
            this.positions[1]
        );

        letter = rotorBackward(
            letter,
            this.wirings[2],
            this.positions[2]
        );

        letter = this.plugboard[letter];

        return letter;
    }


    encrypt(message) {
        let result = "";

        for (const char of message.toUpperCase()) {
            if (ALPHABET.includes(char)) {
                result += this.encryptLetter(char);
            } else {
                result += char;
            }
        }

        return result;
    }
}


function runCipher() {
    try {
        const rotorNames = [
            document.getElementById("rotor1").value,
            document.getElementById("rotor2").value,
            document.getElementById("rotor3").value
        ];

        if (new Set(rotorNames).size !== 3) {
            throw new Error("Please choose three different rotors.");
        }

        const positions = [
            ALPHABET.indexOf(
                document.getElementById("pos1").value
            ),
            ALPHABET.indexOf(
                document.getElementById("pos2").value
            ),
            ALPHABET.indexOf(
                document.getElementById("pos3").value
            )
        ];

        const message =
            document.getElementById("message").value;

        if (!message.trim()) {
            throw new Error("Enter a message first.");
        }

        const plugPairs = getPlugboard();

        const machine = new Enigma(
            rotorNames,
            positions,
            plugPairs
        );

        const output = machine.encrypt(message);

        document.getElementById("result").value = output;

    } catch (error) {
        alert(error.message);
    }
}


async function copyResult() {
    const result =
        document.getElementById("result").value;

    if (!result) {
        alert("There is no result to copy yet.");
        return;
    }

    try {
        await navigator.clipboard.writeText(result);
        alert("Result copied!");
    } catch {
        // Fallback for browsers that block clipboard access.
        const box = document.getElementById("result");
        box.focus();
        box.select();
        document.execCommand("copy");
        alert("Result copied!");
    }
}


function clearAll() {
    document.getElementById("message").value = "";
    document.getElementById("result").value = "";
}


fillSelectors();
</script>

</body>
</html>
