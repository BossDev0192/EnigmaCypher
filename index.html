<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07110f">
<title>Enigma Cipher</title>

<style>
:root {
    --bg-1: #05110f;
    --bg-2: #0c221e;
    --panel: rgba(12, 27, 23, 0.92);
    --panel-soft: rgba(17, 35, 30, 0.8);
    --gold-1: #f4d58b;
    --gold-2: #d7af5d;
    --gold-3: #8c6b2f;
    --ink: #f6f1e7;
    --muted: #b9b4a6;
    --border: rgba(212, 176, 109, 0.6);
    --shadow: rgba(0, 0, 0, 0.26);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg-1);
    color: var(--ink);
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 15%, rgba(244, 213, 139, 0.10), transparent 26%),
        radial-gradient(circle at 90% 80%, rgba(52, 116, 94, 0.16), transparent 30%),
        linear-gradient(145deg, #040b0a, #10241f 45%, #07110f);
    background-attachment: fixed;
    padding: 18px;
}

.app {
    width: 100%;
    max-width: 920px;
    margin: auto;
}

.header {
    text-align: center;
    padding: 10px 4px 18px;
}

.header-badge {
    display: inline-block;
    margin-bottom: 12px;
    padding: 7px 14px;
    border: 1px solid rgba(212, 176, 109, 0.5);
    border-radius: 999px;
    background: rgba(22, 39, 35, 0.8);
    color: var(--gold-1);
    letter-spacing: 2px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
}

.header h1 {
    margin: 0;
    color: var(--gold-1);
    font-family: Georgia, serif;
    font-size: clamp(30px, 8vw, 54px);
    letter-spacing: 2px;
    text-shadow: 0 4px 20px rgba(255, 217, 137, 0.18);
}

.header p {
    margin: 10px 0 0;
    color: var(--gold-2);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.card {
    position: relative;
    background: linear-gradient(180deg, rgba(15, 29, 26, 0.96), rgba(9, 17, 16, 0.94));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 16px 35px var(--shadow);
    overflow: hidden;
}

.card::before {
    content: "";
    position: absolute;
    inset: 0 auto auto 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(244, 213, 139, 0.7), transparent);
}

.section-title {
    color: var(--gold-2);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.4px;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.mode {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.mode button {
    min-height: 50px;
    border: 1px solid rgba(166, 134, 78, 0.8);
    border-radius: 12px;
    background: rgba(16, 35, 30, 0.9);
    color: var(--ink);
    font-size: 15px;
    font-weight: 700;
    transition: all 0.2s ease;
    cursor: pointer;
}

.mode button:hover,
.secondary:hover,
.action:hover {
    transform: translateY(-1px);
    filter: brightness(1.05);
}

.mode button.active {
    background: linear-gradient(135deg, var(--gold-1), #d7af5d);
    color: #17130b;
    box-shadow: 0 10px 20px rgba(215, 175, 93, 0.18);
}

.controls-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.control label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 6px;
    letter-spacing: 0.7px;
    text-transform: uppercase;
}

select, input, textarea {
    width: 100%;
    border: 1px solid rgba(166, 134, 78, 0.9);
    border-radius: 12px;
    background: rgba(7, 17, 15, 0.9);
    color: var(--ink);
    outline: none;
    font-size: 16px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

select {
    height: 49px;
    padding: 0 10px;
}

input {
    height: 50px;
    padding: 0 13px;
}

select:focus, input:focus, textarea:focus {
    border-color: var(--gold-2);
    box-shadow: 0 0 0 3px rgba(223, 185, 98, 0.15);
}

textarea {
    min-height: 150px;
    resize: vertical;
    padding: 13px;
    line-height: 1.5;
}

.action {
    width: 100%;
    min-height: 60px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    color: #19150d;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.7px;
    box-shadow: 0 10px 24px rgba(216, 180, 106, 0.18);
    transition: transform 0.12s ease, filter 0.2s ease;
    cursor: pointer;
}

.action:active {
    transform: scale(0.99);
}

.secondary-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.secondary {
    min-height: 48px;
    border: 1px solid rgba(166, 134, 78, 0.85);
    border-radius: 11px;
    background: rgba(16, 35, 30, 0.92);
    color: var(--ink);
    font-size: 14px;
    font-weight: 700;
    transition: transform 0.12s ease, filter 0.2s ease;
    cursor: pointer;
}

.hint {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 12px;
    line-height: 1.5;
}

.machine {
    display: flex;
    justify-content: center;
    gap: 12px;
    opacity: 0.9;
    margin: 2px 0 14px;
}

.rotor {
    width: 48px;
    height: 48px;
    border: 2px solid rgba(244, 213, 139, 0.9);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: monospace;
    color: var(--gold-1);
    background: rgba(255, 255, 255, 0.03);
    box-shadow: inset 0 0 18px rgba(255, 213, 126, 0.08);
}

@media (max-width: 430px) {
    body {
        padding: 10px;
    }

    .card {
        padding: 12px;
        border-radius: 14px;
    }

    .controls-grid {
        gap: 7px;
    }

    select {
        padding: 0 5px;
    }

    textarea {
        min-height: 130px;
    }

    .header {
        padding-bottom: 12px;
    }

    .header p {
        font-size: 9px;
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>
<div class="app">

    <div class="header">
        <div class="machine">
            <div class="rotor">I</div>
            <div class="rotor">II</div>
            <div class="rotor">III</div>
        </div>
        <div class="header-badge">Cipher Lab</div>
        <h1>ENIGMA CIPHER</h1>
        <p>Encrypt • Decrypt • Secure</p>
    </div>

    <!-- MODE -->
    <div class="card">
        <div class="section-title">Mode</div>
        <div class="mode">
            <button id="encryptMode" class="active" onclick="setMode('encrypt')">
                🔐 Encrypt
            </button>
            <button id="decryptMode" onclick="setMode('decrypt')">
                🔓 Decrypt
            </button>
        </div>
    </div>

    <!-- ROTORS -->
    <div class="card">
        <div class="section-title">Rotors — Left / Middle / Right</div>

        <div class="controls-grid">
            <div class="control">
                <label>Left Rotor</label>
                <select id="rotor1"></select>
            </div>

            <div class="control">
                <label>Middle Rotor</label>
                <select id="rotor2"></select>
            </div>

            <div class="control">
                <label>Right Rotor</label>
                <select id="rotor3"></select>
            </div>
        </div>
    </div>

    <!-- START POSITIONS -->
    <div class="card">
        <div class="section-title">Starting Positions — L / M / R</div>

        <div class="controls-grid">
            <div class="control">
                <label>Left Position</label>
                <select id="pos1"></select>
            </div>

            <div class="control">
                <label>Middle Position</label>
                <select id="pos2"></select>
            </div>

            <div class="control">
                <label>Right Position</label>
                <select id="pos3"></select>
            </div>
        </div>
    </div>

    <!-- PLUGBOARD -->
    <div class="card">
        <div class="section-title">Plugboard</div>
        <input
            id="plugboard"
            type="text"
            value="AB CD EF GH"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="AB CD EF GH"
        >
        <div class="hint">
            Enter pairs such as AB CD EF GH
        </div>
    </div>

    <!-- MESSAGE -->
    <div class="card">
        <div class="section-title">Message</div>
        <textarea
            id="message"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="Enter your message here..."
        ></textarea>
    </div>

    <!-- ACTION -->
    <div class="card">
        <button id="action" class="action" onclick="runCipher()">
            🔐 Encrypt / Get Result
        </button>

        <div class="secondary-row">
            <button class="secondary" onclick="copyResult()">
                📋 Copy Result
            </button>

            <button class="secondary" onclick="clearAll()">
                🗑 Clear
            </button>
        </div>
    </div>

    <!-- RESULT -->
    <div class="card">
        <div class="section-title">Result</div>
        <textarea
            id="result"
            class="result"
            readonly
            placeholder="Your encrypted/decrypted text will appear here..."
        ></textarea>
    </div>

    <div class="hint">
        Use the exact same rotors, positions and plugboard to decrypt.
    </div>

</div>

<script>
const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

const ROTORS = {
    "I":   "EKMFLGDQVZNTOWYHXUSPAIBRCJ",
    "II":  "AJDKSIRUXBLHWTMCQGZNPYFVOE",
    "III": "BDFHJLCPRTXVZNYEIWGAKMUSQO",
    "IV":  "ESOVPZJAYQUIRHXLNFTGKDCMWB",
    "V":   "VZBRGITYUPSDNHLXAWMJQOFECK"
};

const REFLECTOR = "YRUHQSLDPXNGOKMIEBFZCWVJAT";

const NOTCHES = {
    "I": "Q",
    "II": "E",
    "III": "V",
    "IV": "J",
    "V": "Z"
};

let mode = "encrypt";

function fillSelectors() {
    const rotorOptions = ["I", "II", "III", "IV", "V"];

    for (const id of ["rotor1", "rotor2", "rotor3"]) {
        const select = document.getElementById(id);

        for (const rotor of rotorOptions) {
            const option = document.createElement("option");
            option.value = rotor;
            option.textContent = rotor;
            select.appendChild(option);
        }
    }

    document.getElementById("rotor1").value = "I";
    document.getElementById("rotor2").value = "II";
    document.getElementById("rotor3").value = "III";

    for (const id of ["pos1", "pos2", "pos3"]) {
        const select = document.getElementById(id);

        for (const letter of ALPHABET) {
            const option = document.createElement("option");
            option.value = letter;
            option.textContent = letter;
            select.appendChild(option);
        }
    }

    document.getElementById("pos1").value = "A";
    document.getElementById("pos2").value = "B";
    document.getElementById("pos3").value = "C";
}

function setMode(newMode) {
    mode = newMode;

    document.getElementById("encryptMode")
        .classList.toggle("active", mode === "encrypt");

    document.getElementById("decryptMode")
        .classList.toggle("active", mode === "decrypt");

    document.getElementById("action").textContent =
        mode === "encrypt"
        ? "🔐 Encrypt / Get Result"
        : "🔓 Decrypt / Get Result";
}

function makePlugboard(pairs) {
    const board = {};

    for (const c of ALPHABET) {
        board[c] = c;
    }

    for (const [a, b] of pairs) {
        board[a] = b;
        board[b] = a;
    }

    return board;
}

function getPlugboard() {
    const raw = document
        .getElementById("plugboard")
        .value
        .toUpperCase()
        .trim();

    if (!raw) {
        return [];
    }

    const parts = raw.split(/\s+/);
    const pairs = [];
    const used = new Set();

    for (const pair of parts) {
        if (pair.length !== 2) {
            throw new Error(
                `Invalid plugboard pair: ${pair}. Use AB CD EF GH.`
            );
        }

        const a = pair[0];
        const b = pair[1];

        if (!ALPHABET.includes(a) || !ALPHABET.includes(b)) {
            throw new Error("Plugboard pairs can only contain A-Z.");
        }

        if (a === b) {
            throw new Error(`${pair}: a letter cannot connect to itself.`);
        }

        if (used.has(a) || used.has(b)) {
            throw new Error(`Letter used more than once: ${pair}`);
        }

        used.add(a);
        used.add(b);
        pairs.push([a, b]);
    }

    return pairs;
}

function rotorForward(letter, wiring, position) {
    const index = (ALPHABET.indexOf(letter) + position) % 26;
    const mapped = wiring[index];

    return ALPHABET[(ALPHABET.indexOf(mapped) - position + 26) % 26];
}

function rotorBackward(letter, wiring, position) {
    const index = (ALPHABET.indexOf(letter) + position) % 26;
    const mapped = ALPHABET[wiring.indexOf(ALPHABET[index])];

    return ALPHABET[(ALPHABET.indexOf(mapped) - position + 26) % 26];
}

class Enigma {
    constructor(rotorNames, positions, plugPairs) {
        this.rotorNames = rotorNames;

        this.wirings = [
            ROTORS[rotorNames[0]],
            ROTORS[rotorNames[1]],
            ROTORS[rotorNames[2]]
        ];

        this.positions = [...positions];
        this.plugboard = makePlugboard(plugPairs);
    }

    stepRotors() {
        const left = this.positions[0];
        const middle = this.positions[1];
        const right = this.positions[2];

        const middleAtNotch = ALPHABET[middle] === NOTCHES[this.rotorNames[1]];
        const rightAtNotch = ALPHABET[right] === NOTCHES[this.rotorNames[2]];

        if (middleAtNotch) {
            this.positions[0] = (left + 1) % 26;
            this.positions[1] = (middle + 1) % 26;
        } else if (rightAtNotch) {
            this.positions[1] = (middle + 1) % 26;
        }

        this.positions[2] = (right + 1) % 26;
    }

    encryptLetter(letter) {
        this.stepRotors();

        letter = this.plugboard[letter];

        letter = rotorForward(letter, this.wirings[2], this.positions[2]);
        letter = rotorForward(letter, this.wirings[1], this.positions[1]);
        letter = rotorForward(letter, this.wirings[0], this.positions[0]);

        letter = REFLECTOR[ALPHABET.indexOf(letter)];

        letter = rotorBackward(letter, this.wirings[0], this.positions[0]);
        letter = rotorBackward(letter, this.wirings[1], this.positions[1]);
        letter = rotorBackward(letter, this.wirings[2], this.positions[2]);

        letter = this.plugboard[letter];

        return letter;
    }

    encrypt(message) {
        let result = "";

        for (const char of message.toUpperCase()) {
            if (ALPHABET.includes(char)) {
                result += this.encryptLetter(char);
            } else {
                result += char;
            }
        }

        return result;
    }
}

function runCipher() {
    try {
        const rotorNames = [
            document.getElementById("rotor1").value,
            document.getElementById("rotor2").value,
            document.getElementById("rotor3").value
        ];

        if (new Set(rotorNames).size !== 3) {
            throw new Error("Please choose three different rotors.");
        }

        const positions = [
            ALPHABET.indexOf(document.getElementById("pos1").value),
            ALPHABET.indexOf(document.getElementById("pos2").value),
            ALPHABET.indexOf(document.getElementById("pos3").value)
        ];

        const message = document.getElementById("message").value;

        if (!message.trim()) {
            throw new Error("Enter a message first.");
        }

        const plugPairs = getPlugboard();

        const machine = new Enigma(rotorNames, positions, plugPairs);
        const output = machine.encrypt(message);

        document.getElementById("result").value = output;

    } catch (error) {
        alert(error.message);
    }
}

async function copyResult() {
    const result = document.getElementById("result").value;

    if (!result) {
        alert("There is no result to copy yet.");
        return;
    }

    try {
        await navigator.clipboard.writeText(result);
        alert("Result copied!");
    } catch {
        const box = document.getElementById("result");
        box.focus();
        box.select();
        document.execCommand("copy");
        alert("Result copied!");
    }
}

function clearAll() {
    document.getElementById("message").value = "";
    document.getElementById("result").value = "";
}

fillSelectors();
</script>

</body>
</html>
